name: DESIGN-02F Verify

on:
  push:
    branches:
      - design-02f-global-navigation

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: design02f-build
          path: build
          if-no-files-found: error

      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production SPA server
        run: |
          npx --yes serve@14.2.4 -s build -l 4173 > /tmp/design02f-serve.log 2>&1 &
          echo $! > /tmp/design02f-serve.pid
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/design02f-serve.log
          exit 1

      - name: Responsive and accessibility verification
        run: npx playwright test .github/design02f.spec.js --reporter=line
