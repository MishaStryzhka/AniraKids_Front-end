name: ADMIN-FE-02D-02 Verify
on:
  push:
    branches: [admin-fe-02d-02-product-activation]
concurrency:
  group: admin-fe02d02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Prepare evidence
        run: |
          mkdir -p test-evidence/admin-fe02d02
          node -e "require('fs').writeFileSync('test-evidence/admin-fe02d02/BUILD-METADATA.json',JSON.stringify({sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,branch:process.env.GITHUB_REF_NAME,node:process.version},null,2))"
      - name: TypeScript
        run: npm run typecheck
      - name: ADMIN-FE-02D-02 focused
        run: >
          npm test -- --watchAll=false --runInBand --json
          --outputFile=test-evidence/admin-fe02d02/focused-results.json
          src/admin/api/products.test.ts
          src/admin/products/productActivationModel.test.ts
          src/admin/products/useProductActivationController.test.tsx
          src/admin/products/ProductActivationSection.test.tsx
          src/admin/products/productInventoryModel.test.ts
          src/admin/products/useProductInventoryController.test.tsx
          src/admin/products/ProductInventoryItems.test.tsx
          src/admin/products/ProductVariantsSection.test.tsx
          src/admin/products/AdminProductCorePage.test.tsx
      - name: Expanded focused unit and integration
        run: >
          npm test -- --watchAll=false --runInBand --json
          --outputFile=test-evidence/admin-fe02d02/expanded-results.json
          src/admin/api/products.test.ts
          src/admin/products/productActivationModel.test.ts
          src/admin/products/useProductActivationController.test.tsx
          src/admin/products/ProductActivationSection.test.tsx
          src/admin/api/productMedia.test.ts
          src/admin/media/productMediaProviderTransport.test.ts
          src/admin/products/productInventoryModel.test.ts
          src/admin/products/useProductInventoryController.test.tsx
          src/admin/products/ProductInventoryItems.test.tsx
          src/admin/products/productVariantsModel.test.ts
          src/admin/products/ProductVariantsSection.test.tsx
          src/admin/products/AdminProductCorePage.test.tsx
          src/admin/products/AdminProductDeleteFocus.test.tsx
          src/admin/products/ProductMediaSection.test.tsx
          src/admin/products/ProductMediaR2.integration.test.tsx
          src/admin/products/useProductMediaController.test.tsx
          src/admin/products/productMediaModel.test.ts
          src/design-system/components/Dialog/Dialog.test.tsx
      - name: No-env build
        run: npm run build
      - run: mv build build-no-env
      - name: Configured Admin build
        env:
          REACT_APP_LEGACY_API_BASE_URL: https://example.test
          REACT_APP_V2_API_BASE_URL: http://admin-api.test/api/v2
        run: npm run build
      - name: Browser install
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start SPA
        run: |
          npx --yes serve@14.2.4 -s build -l 4173 >test-evidence/admin-fe02d02/configured-server.log 2>&1 &
          npx --yes serve@14.2.4 -s build-no-env -l 4174 >test-evidence/admin-fe02d02/no-env-server.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
      - name: ADMIN-FE-02D-02 Playwright
        env:
          ADMIN_FE02D01_EVIDENCE_DIR: test-evidence/admin-fe02d02
        run: npx playwright test .github/admin-fe02d02.spec.js --reporter=line
      - name: ADMIN-FE-02D-01 regression
        run: npx playwright test .github/admin-fe02d01.spec.js --reporter=line
      - name: ADMIN-FE-02C-03 regression
        run: npx playwright test .github/admin-fe02c03.spec.js --reporter=line
      - name: ADMIN-FE-02C-02 regression
        run: npx playwright test .github/admin-fe02c02.spec.js --reporter=line
      - name: ADMIN-FE-02C-01 regression
        run: npx playwright test --config=.github/admin-fe02c01.playwright.config.js
      - name: ADMIN-FE-02B regression
        run: npx playwright test .github/admin-fe02b.spec.js --reporter=line
      - name: ADMIN-FE-02A regression
        run: npx playwright test .github/admin-fe02a.spec.js --reporter=line
      - name: ADMIN-FE-01 regression
        run: npx playwright test .github/admin-fe01.spec.js --reporter=line
      - name: DESIGN-02 regression
        run: npx playwright test .github/design02f.spec.js --reporter=line
      - name: Evidence manifest
        if: always()
        run: |
          find test-evidence/admin-fe02d02 -type f ! -name MANIFEST.txt -printf '%P\n' | sort > test-evidence/admin-fe02d02/MANIFEST.txt
          cat test-evidence/admin-fe02d02/MANIFEST.txt
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-fe02d02-${{ github.sha }}
          if-no-files-found: error
          path: test-evidence/admin-fe02d02/
          include-hidden-files: true
