name: Admin Overview Verify
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/admin/**'
      - '.github/workflows/admin-overview-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --watchAll=false --runInBand src/admin/pages/AdminHomePage.test.tsx src/admin/api/reservationCalendar.test.ts src/admin/calendar
      - run: npm run build
