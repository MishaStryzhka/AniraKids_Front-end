name: ADMIN-FE-02C-01 Verify
on:
  push:
    branches: [admin-fe-02c-01-product-photos]
concurrency:
  group: admin-fe02c01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: R2 focused integration first
        run: >
          npm test -- --watchAll=false --runInBand
          src/admin/products/useProductMediaController.test.tsx
          src/admin/products/AdminProductCorePage.test.tsx
          src/admin/products/ProductMediaSection.test.tsx
      - name: Focused unit and integration
        run: >
          npm test -- --watchAll=false --runInBand
          src/admin/api/productMedia.test.ts
          src/admin/media/productMediaProviderTransport.test.ts
          src/admin/products/productMediaModel.test.ts
          src/admin/products/useProductMediaController.test.tsx
          src/admin/products/ProductMediaSection.test.tsx
          src/admin/products/AdminProductCorePage.test.tsx
          src/design-system/components/Dialog/Dialog.test.tsx
          src/admin/api/products.test.ts
          src/admin/products/ProductCoreForm.test.tsx
          src/admin/products/productCoreFormModel.test.ts
          src/admin/products/productCoreValidation.test.ts
          src/admin/products/productListSearchParams.test.ts
          src/security/authSensitiveLogging.test.js
          src/redux/auth/operations.security.test.js
          src/config/legacyApi.test.ts
          src/admin/api/client.test.ts
      - name: No-env build
        run: npm run build
      - run: mv build build-no-env
      - name: Configured Admin build
        env:
          REACT_APP_LEGACY_API_BASE_URL: https://example.test
          REACT_APP_V2_API_BASE_URL: http://admin-api.test/api/v2
        run: npm run build
      - name: Browser install
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start SPA
        run: |
          npx --yes serve@14.2.4 -s build -l 4173 >/tmp/admin-fe02c01.log 2>&1 &
          npx --yes serve@14.2.4 -s build-no-env -l 4174 >/tmp/admin-fe02c01-no-env.log 2>&1 &
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
      - name: Prepare evidence directory
        run: mkdir -p test-evidence/admin-fe02c01
      - name: ADMIN-FE-02C-01 Playwright
        env:
          ADMIN_FE02C01_EVIDENCE_DIR: test-evidence/admin-fe02c01
        run: npx playwright test .github/admin-fe02c01.spec.js --reporter=line
      - name: Evidence manifest
        if: always()
        run: |
          mkdir -p test-evidence/admin-fe02c01
          for f in /tmp/admin-fe02c01.log /tmp/admin-fe02c01-no-env.log; do if test -f "$f"; then cp "$f" test-evidence/admin-fe02c01/; fi; done
          if test -d test-results; then cp -R test-results test-evidence/admin-fe02c01/02c-results; fi
      - name: ADMIN-FE-02B regression
        id: browser02b
        run: npx playwright test .github/admin-fe02b.spec.js --reporter=line
      - name: Capture 02B failure evidence
        if: failure() && steps.browser02b.outcome == 'failure'
        run: cp -R test-results test-evidence/admin-fe02c01/02b-results
      - name: ADMIN-FE-02A regression
        id: browser02a
        run: npx playwright test .github/admin-fe02a.spec.js --reporter=line
      - name: Capture 02A failure evidence
        if: failure() && steps.browser02a.outcome == 'failure'
        run: cp -R test-results test-evidence/admin-fe02c01/02a-results
      - name: ADMIN-FE-01 regression
        id: browser01
        run: npx playwright test .github/admin-fe01.spec.js --reporter=line
      - name: Capture 01 failure evidence
        if: failure() && steps.browser01.outcome == 'failure'
        run: cp -R test-results test-evidence/admin-fe02c01/01-results
      - name: DESIGN-02 regression
        id: browserDesign
        run: npx playwright test .github/design02f.spec.js --reporter=line
      - name: Capture DESIGN-02 failure evidence
        if: failure() && steps.browserDesign.outcome == 'failure'
        run: cp -R test-results test-evidence/admin-fe02c01/design02-results
      - name: Final evidence manifest
        if: always()
        run: |
          find test-evidence/admin-fe02c01 -type f ! -name MANIFEST.txt -printf '%P\n' | sort > test-evidence/admin-fe02c01/MANIFEST.txt
          cat test-evidence/admin-fe02c01/MANIFEST.txt
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-fe02c01-${{ github.sha }}
          if-no-files-found: error
          path: test-evidence/admin-fe02c01/
          include-hidden-files: true
