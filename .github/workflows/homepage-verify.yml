name: Homepage Verify
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/MainPage/**'
      - 'src/components/SectionHero/**'
      - 'src/storefront/HomeContent*'
      - 'src/storefront/InformationPages.tsx'
      - 'src/storefront/RentalSteps.tsx'
      - '.github/workflows/homepage-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --watchAll=false --runInBand src/storefront/HomeContent.test.tsx src/storefront/payments src/auth/SeznamCallback.test.js
      - run: npm run build
